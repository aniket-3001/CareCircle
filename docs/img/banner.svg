<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-labelledby="t d">
  <title id="t">Care Circle</title>
  <desc id="d">An animated care circle graph: carers, a person, medicines and an enzyme, with a flagged interaction pulsing and a change travelling from one carer to the person.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2e"/><stop offset="0.55" stop-color="#14304c"/><stop offset="1" stop-color="#1d4a5c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3fd0c0" stop-opacity="0.22"/><stop offset="1" stop-color="#3fd0c0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <path id="travel" d="M780 70 L960 160"/>
  </defs>
  <style>
    text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
    .title{font-size:72px;font-weight:700;fill:#fff;letter-spacing:-1px;animation:rise 1.1s ease-out both}
    .tag{font-size:22px;fill:#bfe9e4;animation:rise 1.1s .25s ease-out both}
    .sub{font-size:16px;fill:#8fb4c4;animation:rise 1.1s .5s ease-out both}
    .chip{fill:#ffffff14;stroke:#ffffff33;animation:rise 1.1s .7s ease-out both}
    .chipt{font-size:14px;fill:#d7eef0;animation:rise 1.1s .7s ease-out both}
    .lab{font-size:13px;fill:#d7eef0;text-anchor:middle}
    .edge{stroke:#6fb7c9;stroke-width:2;fill:none;stroke-dasharray:400;stroke-dashoffset:400;animation:draw 2s ease-out forwards}
    .ack{stroke:#3fd0c0;stroke-width:2.4;fill:none;stroke-dasharray:7 7;opacity:0;animation:flow 1.2s linear infinite,show .01s 2s forwards}
    .flag{stroke:#ff6b6b;stroke-width:3;fill:none;stroke-dasharray:9 6;opacity:0;animation:flow 1.4s linear infinite,show .01s 2.2s forwards}
    .node{animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes show{to{opacity:1}}
    @keyframes flow{to{stroke-dashoffset:-26}}
    @keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
    .n{transform-box:fill-box;transform-origin:center}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.edge{stroke-dashoffset:0}}
  </style>
  <rect width="1280" height="330" fill="url(#bg)"/>
  <rect width="1280" height="330" fill="url(#glow)"/>
  <g opacity="0.07" stroke="#fff"><path d="M0 60H1280M0 120H1280M0 180H1280M0 240H1280M0 300H1280"/><path d="M80 0V330M240 0V330M400 0V330M560 0V330M720 0V330M880 0V330M1040 0V330M1200 0V330"/></g>

  <text class="title" x="64" y="140">Care Circle</text>
  <text class="tag" x="68" y="185">One shared, verified memory of a loved one's medicines.</text>
  <text class="sub" x="68" y="218">Records and cross-checks. Never advises. Built on a FalkorDB graph.</text>
  <rect class="chip" x="66" y="248" width="222" height="32" rx="16"/><text class="chipt" x="82" y="269">Graph Hacks 2026 · Track 02</text>
  <rect class="chip" x="298" y="248" width="150" height="32" rx="16"/><text class="chipt" x="314" y="269">Agent memory</text>

  <!-- edges -->
  <g>
    <path class="edge" d="M780 70 L960 160" style="animation-delay:.4s"/>
    <path class="edge" d="M800 250 L960 160" style="animation-delay:.6s"/>
    <path class="edge" d="M960 160 L1100 70" style="animation-delay:.8s"/>
    <path class="edge" d="M960 160 L1120 190" style="animation-delay:1s"/>
    <path class="edge" d="M960 160 L1000 285" style="animation-delay:1.2s"/>
    <path class="edge" d="M1000 285 L1170 285" style="animation-delay:1.4s"/>
    <path class="edge" d="M1120 190 L1170 285" style="animation-delay:1.6s"/>
  </g>
  <path class="ack" d="M800 250 L880 205"/>
  <path class="flag" d="M1000 285 L1120 190"/>
  <circle cx="1060" cy="237" r="14" fill="none" stroke="#ff6b6b" stroke-width="2"><animate attributeName="r" values="10;26;10" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0;0.9" dur="2.4s" repeatCount="indefinite"/></circle>
  <text class="lab" x="1022" y="232" style="fill:#ff9a9a;font-size:12px">major</text>

  <!-- a change travelling from Ravi to Asha -->
  <circle r="6" fill="#ffd166"><animateMotion dur="2.8s" repeatCount="indefinite" begin="2.4s"><mpath href="#travel"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" repeatCount="indefinite" begin="2.4s"/></circle>

  <!-- nodes -->
  <g class="node n" style="animation-delay:.2s"><circle cx="960" cy="160" r="30" fill="#3fd0c0" opacity="0.25" filter="url(#soft)"><animate attributeName="r" values="26;38;26" dur="3.2s" repeatCount="indefinite"/></circle><circle cx="960" cy="160" r="19" fill="#3fd0c0"/><text class="lab" x="960" y="203">Asha</text></g>
  <g class="node n" style="animation-delay:.3s"><circle cx="780" cy="70" r="13" fill="#7aa2ff"/><text class="lab" x="780" y="46">Ravi</text></g>
  <g class="node n" style="animation-delay:.4s"><circle cx="800" cy="250" r="13" fill="#7aa2ff"/><text class="lab" x="800" y="285">Meena</text><circle cx="800" cy="250" r="19" fill="none" stroke="#ffd166" stroke-width="2"><animate attributeName="opacity" values="1;0.15;1" dur="2s" repeatCount="indefinite"/></circle></g>
  <g class="node n" style="animation-delay:.9s"><circle cx="1100" cy="70" r="12" fill="#c9a7ff"/><text class="lab" x="1100" y="46">metformin</text></g>
  <g class="node n" style="animation-delay:1.1s"><circle cx="1120" cy="190" r="12" fill="#c9a7ff"/><text class="lab" x="1170" y="176">atorvastatin</text></g>
  <g class="node n" style="animation-delay:1.3s"><circle cx="1000" cy="285" r="12" fill="#c9a7ff"/><text class="lab" x="1000" y="316">clarithromycin</text></g>
  <g class="node n" style="animation-delay:1.5s"><circle cx="1170" cy="285" r="10" fill="#ffb86b"/><text class="lab" x="1170" y="316">CYP3A</text></g>
</svg>
