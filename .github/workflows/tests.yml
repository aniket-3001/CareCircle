name: tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a   # FalkorDB 4.22.1, pinned by digest: production, CI and local development run the same database (tests/test_pinned_database.py)
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt -r requirements-integrations.txt
      - uses: actions/cache@v4            # the DDInter portal is slow and sometimes down: keep the verified copy (scripts/fetch_reference.py checks it against its manifest)
        with:
          path: data/ref
          key: reference-data-v1
      - run: python scripts/fetch_reference.py && python -c "from carecircle import reference as r; print(r.load())"
      - run: CC_LLM=0 python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web app (typecheck, unit tests, build)
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run typecheck && npm test && npm run build
      - name: Browser end-to-end check
        run: |
          pip install playwright
          CC_LLM=0 python -m graphmem.api > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
          PORT=8000 CC_SHOTS="$RUNNER_TEMP" python scripts/ui_e2e.py || { tail -30 api.log; exit 1; }
          PORT=8000 CC_SHOTS="$RUNNER_TEMP" python scripts/ui_e2e_accounts.py || { tail -30 api.log; exit 1; }
          PORT=8000 CC_SHOTS="$RUNNER_TEMP" python scripts/ui_e2e_full.py || { tail -30 api.log; exit 1; }
      - name: Scenario tests (real accounts through the API, then in the browser)
        run: |
          CC_LLM=0 python -m graphmem.api > scen.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
          SCENARIO_URL=http://localhost:8000 python scenarios/run.py || { tail -30 scen.log; exit 1; }
          SCENARIO_URL=http://localhost:8000 python scenarios/ui_scenarios.py || { tail -30 scen.log; exit 1; }
      - name: Benchmark gate (same seed as the committed baseline, nothing may get worse)
        run: |
          PYTHONPATH=. CC_LLM=0 python bench/care_bench.py --out run.json > /dev/null
          python bench/gate.py bench/baselines/care_bench.json run.json --skip B1

  # Every push to main that passes the tests is deployed to the live site. AWS access is by short-lived OIDC credentials
  # (no keys stored in GitHub): the role can only be assumed from this repo's main branch and can only run a command on one instance.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      INSTANCE_ID: i-050cbc58e87d6f98e
      SITE: https://3-228-70-117.sslip.io
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::534212416249:role/carecircle-gh-deploy
          aws-region: us-east-1
      - name: Pull and rebuild on the instance
        run: |
          CID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" --timeout-seconds 1200 \
            --parameters 'commands=["set -e","cd /opt/cc","git fetch -q origin main","git reset -q --hard origin/main","docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build 2>&1 | tail -5","docker image prune -f >/dev/null"]' \
            --query Command.CommandId --output text)
          for i in $(seq 1 120); do
            S=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$S" in Success) break;; Failed|Cancelled|TimedOut) break;; esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query "[Status,StandardOutputContent,StandardErrorContent]" --output text
          [ "$S" = "Success" ]
      - name: Wait for the site to answer
        run: |
          for i in $(seq 1 60); do curl -sf -m 5 "$SITE/healthz" && exit 0; sleep 5; done
          echo "site did not become healthy"; exit 1
