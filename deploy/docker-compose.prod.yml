# Production-style stack: only Caddy (HTTPS) is exposed; FalkorDB and the app stay on the internal network.
# Usage: DOMAIN=1-2-3-4.sslip.io GRAPHMEM_ADMIN_KEY=... docker compose -f deploy/docker-compose.prod.yml up -d --build
# On AWS the app uses the instance role for Bedrock, so no keys are passed.
x-logging: &logging              # container logs rotate: three files of 10 MB each per container, so they cannot fill the disk
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  falkordb:
    image: falkordb/falkordb@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a   # FalkorDB 4.22.1, pinned by digest: production, CI and local development run the same database (tests/test_pinned_database.py)
    environment:
      # Snapshots only (a save after 60 s with any change, or 300 s with 100): no append-only log. FalkorDB 4.22.1 crashes replaying a log in which a graph was deleted and then written again
      # under the same name (docs/DETAILS.md, Operations; deploy/RESTORE.md), and this app does that on purpose (demo circles are rotated). A hard crash can lose the last minute; each
      # deploy takes a backup first, and S3 and EBS snapshots sit behind that. A password on the database itself when GRAPHMEM_DB_PASSWORD is set in the environment.
      REDIS_ARGS: "--appendonly no --save 60 1 --save 300 100 ${GRAPHMEM_DB_PASSWORD:+--requirepass ${GRAPHMEM_DB_PASSWORD}}"
      REDISCLI_AUTH: ${GRAPHMEM_DB_PASSWORD:-}          # lets the health check below authenticate
    volumes: ["falkor-data:/var/lib/falkordb/data"]
    mem_limit: 2g                    # the host has 7.8 GB; a runaway query is stopped by the app's own caps first, and cannot take the host down
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: ..
    environment:
      GRAPHMEM_ADMIN_KEY: ${GRAPHMEM_ADMIN_KEY:?set GRAPHMEM_ADMIN_KEY}
      GRAPHMEM_RO_PASSWORD: ${GRAPHMEM_RO_PASSWORD:?set GRAPHMEM_RO_PASSWORD}   # read operations run as a database user that can only call GRAPH.RO_QUERY
      GRAPHMEM_DB_PASSWORD: ${GRAPHMEM_DB_PASSWORD:-}    # when set, the database itself requires this password (see REDIS_ARGS above)
      CC_WHISPER: base                                  # the speech model baked into the image (Dockerfile): no download at the first voice note
      FALKORDB_HOST: falkordb
      CC_COOKIE_SESSIONS: ${CC_COOKIE_SESSIONS:-0}      # 1 = the session is an httpOnly cookie instead of a token in the page's storage (README, Accounts)
      CC_ROLE: ${CC_ROLE:-all}                          # all = serve and run the Telegram/reminder loops; api = serve only; worker = loops only (see docs/DETAILS.md, Operations)
      CC_DEMO: ${CC_DEMO:-1}
      CC_DEMO_MAX: ${CC_DEMO_MAX:-300}                  # oldest demo circle is deleted beyond this many
      CC_MODEL: ${CC_MODEL:-us.amazon.nova-pro-v1:0}
      CC_INTAKE_LLM: ${CC_INTAKE_LLM:-0}                # label reading by the model is opt-in: B7 found no gain over the rules (docs/BENCHMARKS.md)
      CC_COGNITO_POOL_ID: ${CC_COGNITO_POOL_ID:-}        # set both to sign people in with Amazon Cognito (email codes); empty = built-in email and password
      CC_COGNITO_CLIENT_ID: ${CC_COGNITO_CLIENT_ID:-}
      CC_VAPID_PUBLIC: ${CC_VAPID_PUBLIC:-}         # browser notifications: both keys, or the feature is off
      CC_VAPID_PRIVATE: ${CC_VAPID_PRIVATE:-}
      CC_VAPID_SUBJECT: ${CC_VAPID_SUBJECT:-https://${DOMAIN}}   # who the push services can contact: the site, not a person
      CC_PUBLIC_URL: ${CC_PUBLIC_URL:-https://${DOMAIN}}         # the host the MCP endpoint (/mcp) accepts
      AWS_REGION: ${AWS_REGION:-us-east-1}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes: ["ref-data:/app/data/ref"]
    mem_limit: 3g                    # the speech and OCR models live here: a runaway job is killed and restarted, not the whole host
    logging: *logging
    depends_on:
      falkordb: {condition: service_healthy}
    restart: unless-stopped
  caddy:
    image: caddy:2
    command: caddy reverse-proxy --from ${DOMAIN:?set DOMAIN} --to api:8000
    ports: ["80:80", "443:443"]
    volumes: ["caddy-data:/data"]
    mem_limit: 256m
    logging: *logging
    depends_on: [api]
    restart: unless-stopped
volumes:
  falkor-data:
  ref-data:
  caddy-data:
