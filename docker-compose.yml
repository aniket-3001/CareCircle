# Durable deployment: FalkorDB with a named volume and append-only file, plus the API/UI.
# Usage: GRAPHMEM_ADMIN_KEY=change-me docker compose up -d --build
services:
  falkordb:
    image: falkordb/falkordb@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a   # FalkorDB 4.22.1, pinned by digest: production, CI and local development run the same database (tests/test_pinned_database.py)
    environment:
      REDIS_ARGS: "--appendonly yes --appendfsync everysec"
    volumes: ["falkor-data:/var/lib/falkordb/data"]
    ports: ["${FALKORDB_PORT:-6379}:6379", "${BROWSER_PORT:-3000}:3000"]   # 3000 = FalkorDB Browser
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: .
    environment:
      GRAPHMEM_ADMIN_KEY: ${GRAPHMEM_ADMIN_KEY:?set GRAPHMEM_ADMIN_KEY}
      FALKORDB_HOST: falkordb
      GRAPHMEM_RO_PASSWORD: ${GRAPHMEM_RO_PASSWORD:-}   # set to run read operations as a GRAPH.RO_QUERY-only database user
      CC_DEMO: ${CC_DEMO:-1}                            # public "Start a demo circle" button (synthetic data only)
      CC_MODEL: ${CC_MODEL:-us.amazon.nova-pro-v1:0}    # Bedrock model for reading labels; CC_LLM=0 disables it (rules only)
      CC_COGNITO_POOL_ID: ${CC_COGNITO_POOL_ID:-}        # set both to sign people in with Amazon Cognito (email codes); empty = built-in email and password
      CC_COGNITO_CLIENT_ID: ${CC_COGNITO_CLIENT_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}      # optional: run the Telegram bot too
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes: ["ref-data:/app/data/ref"]              # reference data cache: downloaded once, reused on rebuilds
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      falkordb: {condition: service_healthy}
    restart: unless-stopped
volumes:
  falkor-data:
  ref-data:
