# Durable deployment: FalkorDB with a named volume and append-only file, plus the API/UI.
# Usage: GRAPHMEM_ADMIN_KEY=change-me docker compose up -d --build
services:
  falkordb:
    image: falkordb/falkordb:latest
    environment:
      REDIS_ARGS: "--appendonly yes --appendfsync everysec"
    volumes: ["falkor-data:/var/lib/falkordb/data"]
    ports: ["${FALKORDB_PORT:-6379}:6379", "${BROWSER_PORT:-3000}:3000"]   # 3000 = FalkorDB Browser
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: .
    environment:
      GRAPHMEM_ADMIN_KEY: ${GRAPHMEM_ADMIN_KEY:?set GRAPHMEM_ADMIN_KEY}
      FALKORDB_HOST: falkordb
      GRAPHMEM_RO_PASSWORD: ${GRAPHMEM_RO_PASSWORD:-}   # set to run read operations as a GRAPH.RO_QUERY-only database user
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      falkordb: {condition: service_healthy}
    restart: unless-stopped
volumes:
  falkor-data:
